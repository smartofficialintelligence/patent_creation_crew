# CrewAI native crew configuration
# This file references agents.yaml and tasks.yaml and defines the crew structure
# 
# PARALLEL EXECUTION SUPPORT:
# Use --parallel flag to enable intelligent parallel task execution
# - Automatically analyzes task dependencies from tasks.yaml context fields
# - Executes independent tasks in parallel for 40-60% performance improvement
# - Maintains CrewAI compatibility while optimizing execution flow
# - Use --max-workers N to control parallel worker count (default: 4)

crew:
  name: "Patent Automation Crew"
  description: "A crew for automated patent research, drafting, and review."
  agents: !include agents.yaml
  tasks: !include tasks.yaml
  process: sequential
  memory: true
  verbose: true
  max_rpm: 30 