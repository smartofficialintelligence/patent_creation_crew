# Dynamic Resource Optimization Configuration
# Achieves 25-35% cost reduction through intelligent resource management
# AGENT-AWARE: Respects thoughtful model selections from agents.yaml

# Model configurations with real-time cost data
# Including ALL models from your agents.yaml configuration
models:
  # OpenAI Models
  gpt-4o:
    cost_per_token: 0.00003  # $0.03 per 1K tokens
    context_limit: 128000
    quality_score: 0.95
    speed_score: 0.8
    suitable_for: ['critical', 'complex']
    description: "Premium model for complex patent and legal analysis"
    
  gpt-4o-mini:
    cost_per_token: 0.000006  # $0.006 per 1K tokens (5x cheaper)
    context_limit: 128000
    quality_score: 0.85
    speed_score: 0.9
    suitable_for: ['simple', 'moderate']
    description: "Cost-effective model for standard tasks"
    
  gpt-3.5-turbo:
    cost_per_token: 0.000002  # $0.002 per 1K tokens (15x cheaper)
    context_limit: 16000
    quality_score: 0.75
    speed_score: 0.95
    suitable_for: ['simple']
    description: "Ultra-cost-effective model for simple tasks"
    
  # Claude Models (from your agents.yaml)
  claude-sonnet-4-20250514:
    cost_per_token: 0.000015  # $0.015 per 1K tokens
    context_limit: 200000
    quality_score: 0.93
    speed_score: 0.85
    suitable_for: ['complex', 'moderate']
    description: "Excellent for patent writing and documentation"
    
  claude-opus-4-20250514:
    cost_per_token: 0.000075  # $0.075 per 1K tokens (premium)
    context_limit: 200000
    quality_score: 0.97
    speed_score: 0.75
    suitable_for: ['critical', 'complex']
    description: "Premium model for final editing and complex analysis"
    
  # Specialized Models (from your agents.yaml)
  deepseek-v2:
    cost_per_token: 0.000005  # $0.005 per 1K tokens
    context_limit: 64000
    quality_score: 0.88
    speed_score: 0.9
    suitable_for: ['complex', 'moderate']
    description: "Specialized for technical claims and analysis"
    
  grok-3:
    cost_per_token: 0.000008  # $0.008 per 1K tokens
    context_limit: 128000
    quality_score: 0.87
    speed_score: 0.88
    suitable_for: ['moderate', 'complex']
    description: "Specialized for strategic and legal review"

# AGENT-AWARE OPTIMIZATION RULES
# Respects your thoughtful model choices while optimizing other aspects
agent_optimization:
  # Agent-specific model preservation
  preserve_agent_models:
    patent_researcher: "gpt-4o"
    patent_writer: "claude-sonnet-4-20250514"
    diagram_specialist: "gpt-4o"
    claims_specialist: "deepseek-v2"
    legal_reviewer: "grok-3"
    associate_editor: "grok-3"
    editor: "claude-opus-4-20250514"
    valuation_expert: "gpt-4o"
    cover_sheet_specialist: "claude-sonnet-4-20250514"
    demo_concept_reviewer: "grok-3"
    
  # Agent-specific optimization strategies
  optimization_strategies:
    patent_researcher:
      model_fixed: true  # Never change model
      context_optimization: "aggressive"  # Can optimize context heavily
      token_allocation: "smart"  # Smart token budgeting
      caching_priority: "high"  # Cache research results
      
    patent_writer:
      model_fixed: true
      context_optimization: "moderate"  # Preserve writing quality
      token_allocation: "generous"  # Writing needs more tokens
      caching_priority: "medium"
      
    diagram_specialist:
      model_fixed: true
      context_optimization: "aggressive"  # Diagrams can use compressed context
      token_allocation: "efficient"  # Diagrams are usually shorter
      caching_priority: "high"  # Reuse diagram patterns
      
    claims_specialist:
      model_fixed: true  # DeepSeek chosen for claims expertise
      context_optimization: "conservative"  # Claims need precision
      token_allocation: "smart"
      caching_priority: "medium"
      
    legal_reviewer:
      model_fixed: true  # Grok chosen for legal expertise
      context_optimization: "moderate"
      token_allocation: "smart"
      caching_priority: "high"  # Legal patterns repeat
      
    associate_editor:
      model_fixed: true
      context_optimization: "moderate"
      token_allocation: "efficient"
      caching_priority: "medium"
      
    editor:
      model_fixed: true  # Claude Opus chosen for final editing
      context_optimization: "conservative"  # Final editing needs full context
      token_allocation: "generous"
      caching_priority: "low"  # Final editing is usually unique
      
    valuation_expert:
      model_fixed: true
      context_optimization: "smart"  # Can optimize technical details
      token_allocation: "efficient"
      caching_priority: "high"  # Valuation patterns repeat
      
    cover_sheet_specialist:
      model_fixed: true
      context_optimization: "aggressive"  # Forms can be heavily optimized
      token_allocation: "minimal"  # Forms are short
      caching_priority: "very_high"  # Forms are highly reusable
      
    demo_concept_reviewer:
      model_fixed: true
      context_optimization: "moderate"
      token_allocation: "smart"
      caching_priority: "medium"

# Context optimization settings (applies to all agents)
context_optimization:
  # Agent-specific context limits
  agent_context_limits:
    patent_researcher: 80000   # Research needs large context
    patent_writer: 100000      # Writing needs largest context
    diagram_specialist: 40000  # Diagrams need moderate context
    claims_specialist: 60000   # Claims need detailed context
    legal_reviewer: 70000      # Legal needs comprehensive context
    associate_editor: 50000    # Editing needs moderate context
    editor: 120000             # Final editing needs full context
    valuation_expert: 50000    # Valuation needs moderate context
    cover_sheet_specialist: 10000  # Forms need minimal context
    demo_concept_reviewer: 60000   # Strategy needs good context
    
  # Agent-specific compression ratios
  agent_compression_ratios:
    patent_researcher: 0.6     # Aggressive compression for research
    patent_writer: 0.8         # Light compression for writing
    diagram_specialist: 0.5    # Heavy compression for diagrams
    claims_specialist: 0.9     # Minimal compression for claims
    legal_reviewer: 0.7        # Moderate compression for legal
    associate_editor: 0.7      # Moderate compression for editing
    editor: 0.9                # Minimal compression for final edit
    valuation_expert: 0.6      # Aggressive compression for valuation
    cover_sheet_specialist: 0.3 # Very heavy compression for forms
    demo_concept_reviewer: 0.7  # Moderate compression for strategy

# Context optimization settings
context_optimization:
  max_context_size: 50000  # Maximum context size in tokens
  compression_ratio: 0.7   # Target compression ratio
  smart_truncation: true   # Enable intelligent truncation
  cache_reuse_threshold: 0.8  # Cache reuse similarity threshold
  
  # Context reduction strategies
  strategies:
    - name: "remove_redundant"
      priority: 1
      description: "Remove redundant and duplicate information"
      
    - name: "summarize_background"
      priority: 2
      description: "Summarize background information"
      
    - name: "truncate_examples"
      priority: 3
      description: "Truncate lengthy examples while preserving key points"
      
    - name: "compress_references"
      priority: 4
      description: "Compress reference materials and citations"

# Resource limits and budgets
resource_limits:
  max_cost_per_patent: 5.0      # Maximum cost per patent in USD
  max_tokens_per_task: 50000    # Maximum tokens per task
  max_parallel_tasks: 8         # Maximum parallel tasks
  daily_cost_budget: 100.0      # Daily cost budget in USD
  monthly_cost_budget: 2000.0   # Monthly cost budget in USD
  
  # Emergency limits
  emergency_stop_cost: 50.0     # Emergency stop if single patent exceeds this
  emergency_stop_tokens: 100000 # Emergency stop if single task exceeds this

# Task complexity analysis
task_complexity:
  # Patterns for identifying complex tasks
  complex_patterns:
    - "patent_document"
    - "legal_review"
    - "claims_specialist"
    - "prior_art_research"
    - "comprehensive_analysis"
    - "strategic_evaluation"
    
  # Patterns for identifying moderate tasks
  moderate_patterns:
    - "architecture_diagram"
    - "colab_demo"
    - "valuation"
    - "review"
    - "refinement"
    - "optimization"
    
  # Patterns for identifying simple tasks
  simple_patterns:
    - "cover_sheet"
    - "summary"
    - "formatting"
    - "basic_analysis"
    - "data_extraction"
    
  # Scoring weights
  scoring_weights:
    task_name: 0.3
    content_length: 0.2
    dependencies: 0.2
    legal_keywords: 0.2
    historical_complexity: 0.1

# Dynamic model selection rules
model_selection:
  # Quality requirements by task type
  quality_requirements:
    patent_document: 0.9
    legal_review: 0.9
    claims_specialist: 0.9
    prior_art_research: 0.85
    architecture_diagram: 0.8
    colab_demo: 0.8
    valuation: 0.85
    cover_sheet: 0.7
    summary: 0.7
    
  # Cost sensitivity by task type (higher = more cost-sensitive)
  cost_sensitivity:
    patent_document: 0.5    # High quality required, cost less important
    legal_review: 0.5       # High quality required, cost less important
    claims_specialist: 0.5  # High quality required, cost less important
    prior_art_research: 0.7 # Moderate cost sensitivity
    architecture_diagram: 0.8  # Higher cost sensitivity
    colab_demo: 0.8         # Higher cost sensitivity
    valuation: 0.6          # Moderate cost sensitivity
    cover_sheet: 0.9        # Very cost sensitive
    summary: 0.9            # Very cost sensitive
    
  # Fallback rules
  fallback_rules:
    - condition: "estimated_tokens > 80000"
      action: "use_gpt_4o"
      reason: "Large context requires premium model"
      
    - condition: "quality_requirement > 0.9"
      action: "use_gpt_4o"
      reason: "High quality requirement"
      
    - condition: "task_contains_legal_keywords"
      action: "use_gpt_4o"
      reason: "Legal precision required"
      
    - condition: "cost_sensitivity > 0.8"
      action: "prefer_cheaper_model"
      reason: "Cost optimization priority"

# Parallel execution optimization
parallel_optimization:
  # Resource sharing strategies
  resource_sharing:
    enable: true
    max_shared_context: 20000
    context_reuse_threshold: 0.7
    
  # Load balancing
  load_balancing:
    enable: true
    max_cost_per_worker: 1.0
    rebalance_threshold: 0.8
    
  # Batch processing
  batch_processing:
    enable: true
    min_batch_size: 2
    max_batch_size: 5
    similar_task_threshold: 0.8

# Caching optimization
caching:
  # Smart caching strategies
  strategies:
    - name: "semantic_similarity"
      threshold: 0.85
      description: "Cache based on semantic similarity"
      
    - name: "exact_match"
      threshold: 1.0
      description: "Cache exact matches"
      
    - name: "partial_reuse"
      threshold: 0.7
      description: "Reuse partial results"
      
  # Cache management
  management:
    max_cache_size_mb: 1000
    cleanup_frequency: 100
    retention_days: 30
    
  # Cost-aware caching
  cost_aware:
    enable: true
    expensive_result_threshold: 0.5  # Cache results costing more than $0.50
    cache_hit_value: 0.9  # Value multiplier for cache hits

# Monitoring and alerts
monitoring:
  # Cost monitoring
  cost_monitoring:
    enable: true
    alert_threshold: 0.8  # Alert when reaching 80% of budget
    report_frequency: 100  # Report every 100 tasks
    
  # Performance monitoring
  performance_monitoring:
    enable: true
    track_metrics: ['cost', 'tokens', 'time', 'quality']
    baseline_period_days: 7
    
  # Alerts
  alerts:
    - type: "cost_overrun"
      threshold: 1.5
      description: "Task cost exceeds estimate by 50%"
      
    - type: "budget_warning"
      threshold: 0.8
      description: "Budget utilization warning"
      
    - type: "quality_degradation"
      threshold: 0.9
      description: "Quality score below threshold"
      
    - type: "optimization_opportunity"
      threshold: 0.2
      description: "Potential 20%+ cost reduction identified"

# Optimization targets
targets:
  # Primary targets
  cost_reduction: 0.30        # 30% cost reduction target
  quality_preservation: 0.95  # Maintain 95% of original quality
  time_impact: 0.10           # Max 10% time increase
  
  # Secondary targets
  cache_hit_rate: 0.6         # 60% cache hit rate
  model_diversity: 0.4        # 40% tasks using optimized models
  resource_utilization: 0.8   # 80% resource utilization
  
  # Success metrics
  success_metrics:
    - metric: "cost_per_patent"
      target: 3.0
      description: "Average cost per patent under $3"
      
    - metric: "processing_time"
      target: 1.1
      description: "Processing time within 110% of baseline"
      
    - metric: "quality_score"
      target: 0.9
      description: "Quality score above 90%"
      
    - metric: "optimization_rate"
      target: 0.7
      description: "70% of tasks optimized"

# Advanced features
advanced:
  # Machine learning optimization
  ml_optimization:
    enable: true
    model_training_frequency: 1000  # Train after 1000 tasks
    feature_engineering: true
    prediction_accuracy_threshold: 0.8
    
  # Dynamic pricing
  dynamic_pricing:
    enable: true
    price_update_frequency: 3600  # Update prices every hour
    price_volatility_threshold: 0.1
    
  # Adaptive thresholds
  adaptive_thresholds:
    enable: true
    adaptation_frequency: 500  # Adapt every 500 tasks
    learning_rate: 0.1
    
  # Multi-objective optimization
  multi_objective:
    enable: true
    objectives: ['cost', 'quality', 'time']
    weights: [0.5, 0.3, 0.2]  # Cost 50%, Quality 30%, Time 20%

# Integration settings
integration:
  # CrewAI integration
  crewai:
    enable: true
    agent_optimization: true
    task_optimization: true
    workflow_optimization: true
    
  # Validation system integration
  validation:
    enable: true
    pre_execution_optimization: true
    post_execution_analysis: true
    
  # Parallel execution integration
  parallel:
    enable: true
    resource_aware_scheduling: true
    load_balancing: true
    
  # Monitoring integration
  monitoring:
    enable: true
    real_time_tracking: true
    alert_integration: true 