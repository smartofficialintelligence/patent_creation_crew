# Task generation configuration
task_generation:
  variable_mapping:
    title: "patent_idea.get('title', 'Unknown Patent')"
    id: "patent_idea.get('id', 'UNKNOWN-001')"
    description: "patent_idea['description']"
    claims_list: "chr(10).join(f'- {claim}' for claim in patent_idea['key_claims'])"
    key_claims: "patent_idea['key_claims']"
    value_estimate: "patent_idea.get('value_estimate', '$2-15M')"
    market_applications: "patent_idea.get('market_applications', ['AI optimization'])"
    technical_features: "patent_idea.get('technical_features', [])"
    differentiation: "patent_idea.get('differentiation', 'TBD')"
    phase_name: "PATENT_CONFIG['portfolio_tiers'][phase]['name']"
    description_length: "len(patent_idea['description'].split())"
    claims_count: "len(patent_idea['key_claims'])"
    total_claims: "len(patent_idea.get('key_claims', []))"
    complexity_score: "calculate_complexity(patent_idea)"
    urgency_level: "patent_idea.get('urgency', 'NORMAL')"
    risk_level: "patent_idea.get('prior_art_risk', 'MEDIUM')"
    # Add new fields from the new YAML structure
    disclaimers: "patent_idea.get('disclaimers', [])"
    key_innovations: "patent_idea.get('key_innovations', [])"
    evidence: "patent_idea.get('evidence', [])"
    codebase_references: "patent_idea.get('codebase_references', [])"
    filing_requirements: "patent_idea.get('filing_requirements', [])"
    alternative_embodiments: "patent_idea.get('alternative_embodiments', [])"
    audit_steps: "patent_idea.get('audit_steps', [])"
    dependencies: "patent_idea.get('dependencies', {})"
    implementation_complexity: "patent_idea.get('implementation_complexity', 'Medium')"
    prior_art_risk: "patent_idea.get('prior_art_risk', 'Medium')"
    business_context: "patent_idea.get('business_context', [])"
    enterprise_features: "patent_idea.get('enterprise_features', [])" 