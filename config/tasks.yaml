    - Quality Standards: Professional analysis standards
    
    Ensure document clearly indicates it is for research and analysis purposes only.
  expected_output: |
    Patent analysis cover sheet including:
    - Clear research and analysis disclaimers
    - Document information and reference details
    - Analysis date and purpose
