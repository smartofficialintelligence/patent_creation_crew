# Error Recovery Task
error_recovery:
  description: |
    Handle failed tasks and provide recovery options:
    
    PATENT: {title} (ID: {id})
    
    RECOVERY REQUIREMENTS:
    1. Analyze failed task and identify root cause
    2. Provide specific recovery recommendations
    3. Implement automatic retry with different parameters
    4. Generate fallback solutions
    5. Document recovery actions taken
    
    RECOVERY STRATEGIES:
    - Retry with different model
    - Simplify task requirements
    - Use alternative approach
    - Request human intervention
    - Generate partial results
    
    Provide comprehensive error recovery report.
  expected_output: |
    Error recovery report including:
    - Failed task analysis
    - Root cause identification
    - Recovery recommendations
    - Retry attempts and results
    - Fallback solutions implemented
    - Recovery action documentation
  output_pydantic: lib.pydantic_output_models.GenericAnalysisOutput
  output_file: "output/{phase}/{id}_error_recovery.md"
  agent: recovery_manager
  context: [failed_task]
  priority: critical
  timeout: 180
  retry_attempts: 1

