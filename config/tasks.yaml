# Task Configuration for Patent Automation System
# Using CrewAI's native YAML format - ENHANCED VERSION

# Task Dependencies and Workflow Management
task_dependencies:
  prior_art_research:
    requires: []
    optional: []
  
  claims_refinement:
    requires: [prior_art_research]
    optional: []
  
  patent_document:
    requires: [prior_art_research, claims_refinement]
    optional: [architecture_diagram]
  
  architecture_diagram:
    requires: [prior_art_research, claims_refinement, patent_document]
    optional: []
  
  legal_review:
    requires: [prior_art_research, claims_refinement, patent_document]
    optional: []
  
  associate_editor_review:
    requires: [patent_document]
    optional: []
  
  editorial_review:
    requires: [patent_document, associate_editor_review]
    optional: []
  
  patent_integration:
    requires: [prior_art_research, claims_refinement, patent_document, editorial_review]
    optional: []
  
  cover_sheet:
    requires: [prior_art_research, claims_refinement, patent_document, legal_review, patent_integration]
    optional: []
  
  patent_valuation:
    requires: [prior_art_research, claims_refinement, legal_review]
    optional: []
  
  claim_recommendations:
    requires: [prior_art_research]
    optional: []

# Quality Gates and Validation
quality_gates:
  prior_art_research:
    min_prior_art_found: 5
    max_risk_score: 0.7
    required_sections: [patent_analysis, academic_review, risk_assessment]
  
  patent_document:
    min_word_count: 2000
    required_sections: [background, claims, description, commercial_value]
    max_risk_score: 0.8
  
  claims_refinement:
    min_claims_count: 3
    required_claim_types: [independent, dependent]
    max_prior_art_conflicts: 2

# Resource Management
resource_management:
  max_concurrent_tasks: 3
  memory_limit: "8GB"
  timeout_seconds: 300
  retry_attempts: 3
  priority_queue: true

# Error Recovery Strategies
error_recovery_strategies:
  tool_failure:
    retry_with_different_model: true
    fallback_to_simplified_task: true
    max_retry_attempts: 3
  
  content_quality:
    regenerate_with_enhanced_prompt: true
    request_human_review: true
    quality_threshold: 0.7
  
  timeout_handling:
    extend_timeout: true
    split_large_tasks: true
    parallel_processing: true

# Task Priority System
task_priority:
  critical: [prior_art_research, patent_document]
  high: [claims_refinement, legal_review, editorial_review]
  medium: [architecture_diagram, patent_valuation, cover_sheet]
  low: [colab_demo_generation, claim_recommendations]

prior_art_research:
  description: |
    Conduct comprehensive prior art search and patentability analysis for:
    
    PATENT: {title}
    ID: {id}
    DESCRIPTION: {description}
    
    RESEARCH REQUIREMENTS:
    1. Search Lens Patents API for real patent data
    2. Review academic literature (arXiv, IEEE, ACM)
    3. Analyze patent applications and published research
    4. Assess novelty and non-obviousness using real data
    5. Identify potential prior art conflicts from actual patents
    6. Provide differentiation strategy recommendations based on real findings
    
    SEARCH FOCUS:
    - Agent-based optimization systems
    - Semantic reasoning in AI/ML
    - Multi-agent coordination protocols  
    - Neural network optimization alternatives
    - AutoML and hyperparameter optimization
    - Explainable AI and interpretable optimization
    - agentic gradient descent
    
    KEY CLAIMS TO ANALYZE:
    {key_claims}
    
    DELIVERABLE: Comprehensive prior art analysis with specific recommendations
    for claim refinement and prosecution strategy.
    
    TOOL PARAMETERS:
    Use real_patent_search_tool with these exact parameters:
    - patent_id: {id}
    - title: {title}
    - description: {description}
    - key_claims: [list of claims]
    - technical_features: {technical_features}
    - market_applications: {market_applications}
    - differentiation: {differentiation}
    - phase: {phase}
  expected_output: |
    Comprehensive prior art analysis including:
    - Real patent data from Lens Patents API
    - Academic literature review (arXiv, IEEE, ACM)
    - Prior art conflict identification and analysis
    - Novelty and non-obviousness assessment
    - Differentiation strategy recommendations
    - Risk assessment and mitigation strategies
    - Specific claim refinement suggestions
  output_pydantic: lib.pydantic_output_models.PriorArtAnalysisOutput
  output_file: "output/{phase}/{id}_prior_art_analysis.md"
  agent: patent_researcher
  priority: critical
  timeout: 600
  retry_attempts: 3

claims_refinement:
  description: |
    Refine and optimize patent claims for maximum strength and commercial value:
    
    PATENT: {title} (ID: {id})
    
    ORIGINAL CLAIMS:
    {key_claims}
    
    REFINEMENT OBJECTIVES:
    1. Maximize claim breadth while ensuring validity
    2. Avoid identified prior art conflicts  
    3. Include specific technical differentiators
    4. Structure for optimal licensing value
    5. Ensure enforceability and detectability
    6. Plan prosecution and amendment strategy
    
    TECHNICAL FOCUS AREAS:
    - Semantic reasoning vs. mathematical optimization
    - Performance specifications (sub-5ms coordination)
    - Interpretability and explainability features
    - GPU optimization and scalability
    - Agent coordination protocols
    - Memory and learning capabilities
    
    VALUE TARGET: {value_estimate}
    MARKET APPLICATIONS: {market_applications}
    
    Use prior art analysis to inform claim refinement strategy.
    
    TOOL PARAMETERS:
    Use smart_claim_refinement_tool with these exact parameters:
    - patent_id: {id}
    - title: {title}
    - description: {description}
    - key_claims: [list of original claims]
    - technical_features: {technical_features}
    - market_applications: {market_applications}
    - value_target: {value_estimate}
    - differentiation: {differentiation}
  expected_output: |
    Refined patent claims package including:
    - Independent claims with maximum defensible breadth
    - Dependent claims covering key technical features
    - Alternative claim formulations for prosecution flexibility
    - Prior art differentiation analysis
    - Claim strength assessment (breadth vs. validity)
    - Amendment strategy and fallback positions
    - Commercial value optimization analysis
  output_pydantic: lib.pydantic_output_models.ClaimsRefinementOutput
  output_file: "output/{phase}/{id}_refined_claims.md"
  agent: claims_specialist
  context: [prior_art_research]
  priority: high
  timeout: 450
  retry_attempts: 2

patent_document:
  description: |
    Create comprehensive document which could be a provisional patent application:
    
    PATENT: {title} (ID: {id})
    PHASE: {phase} ({phase_name})
    
    DOCUMENT REQUIREMENTS:
    1. Professional USPTO-compliant format
    2. Comprehensive technical description
    3. Clear enablement for skilled artisan
    4. Strong claims section with refined claims
    5. Commercial value proposition
    6. Implementation examples and code
    7. Prior art differentiation discussion
    8. Regulatory compliance considerations
    
    CRITICAL REQUIREMENT: You MUST create the ACTUAL patent document content, not a description or summary of what the document should contain. Write complete technical specifications, full claims, and comprehensive background sections.
    
    PATENT DATA:
    - Description: {description}
    - Technical Features: {technical_features}
    - Market Applications: {market_applications}
    - Value Estimate: {value_estimate}
    - Differentiation: {differentiation}
    
    QUALITY STANDARDS:
    - USPTO provisional patent format compliance
    - Clear technical disclosure sufficient for continuation
    - Professional language and structure
    - Complete enablement for implementation
    - Strategic claim positioning for portfolio value
    - ACTUAL document content, not summaries or descriptions
    
    CONTENT REQUIREMENTS:
    - Write complete technical specifications with full implementation details
    - Include comprehensive background section with actual technical content
    - Provide detailed description with examples, algorithms, and code
    - Write out claims in full legal format, not just describe them
    - Create professional document structure and formatting
    - Ensure the document is complete and ready for review
    
    Incorporate refined claims and prior art analysis findings.
    
    TOOL PARAMETERS:
    Use patent_document_tool with these exact parameters:
    - patent_id: {id}
    - title: {title}
    - description: {description}
    - key_claims: [list of claims from refined claims]
    - technical_features: {technical_features}
    - market_applications: {market_applications}
    - differentiation: {differentiation}
    - key_innovations: {key_innovations}
    - evidence: {evidence}
    - codebase_references: {codebase_references}
    - filing_requirements: {filing_requirements}
    - alternative_embodiments: {alternative_embodiments}
    - dependencies: {dependencies}
    - implementation_complexity: {implementation_complexity}
    - prior_art_risk: {prior_art_risk}
    - disclaimers: {disclaimers}
    - business_context: {business_context}
    - enterprise_features: {enterprise_features}
  expected_output: |
    Complete provisional patent application including:
    - Title page with inventor and filing information
    - Cross-reference to related applications
    - Field of invention and background
    - Summary of invention with key advantages
    - Detailed technical description with examples
    - Refined claims section (independent and dependent)
    - Commercial value and market analysis
    - Prior art differentiation section
    - Conclusion and filing recommendations
  output_pydantic: lib.pydantic_output_models.PatentDocumentOutput
  output_file: "output/{phase}/{id}_patent_application.md"
  agent: patent_writer
  context: [prior_art_research, claims_refinement]
  priority: critical
  timeout: 900
  retry_attempts: 2

architecture_diagram:
  description: |
    Create comprehensive, patent-quality architecture diagrams:
    
    PATENT: {title} (ID: {id})
    PHASE: {phase} ({phase_name})
    
    DIAGRAM REQUIREMENTS:
    1. System architecture overview diagram
    2. Component interaction flow diagrams
    3. Data flow and processing diagrams
    4. Agent coordination and communication diagrams
    5. Technical feature visualization diagrams
    6. Prior art differentiation diagrams
    7. Performance optimization diagrams
    
    DIAGRAM QUALITY STANDARDS:
    - Patent-compliant professional formatting
    - Clear technical accuracy and detail
    - Visual differentiation from prior art
    - Comprehensive coverage of technical features
    - Professional annotations and labels
    - Suitable for patent examiner review
    
    PATENT DATA:
    - Description: {description}
    - Technical Features: {technical_features}
    - Market Applications: {market_applications}
    - Key Claims: {key_claims}
    - Differentiation: {differentiation}
    
    DIAGRAM TYPES:
    - System architecture overview (high-level system design)
    - Component interaction diagrams (detailed component relationships)
    - Data flow diagrams (information and data processing flows)
    - Agent coordination networks (multi-agent system interactions)
    - Technical feature visualizations (key technical innovations)
    - Performance optimization diagrams (system performance characteristics)
    - Prior art differentiation (visual comparison with existing solutions)
    
    Create professional, patent-quality diagrams that clearly illustrate 
    the invention's technical architecture and differentiate from prior art.
    
    TOOL PARAMETERS:
    Use architecture_diagram_tool with these exact parameters:
    - patent_id: {id}
    - title: {title}
    - description: {description}
    - key_claims: [list of claims from refined claims]
    - technical_features: {technical_features}
    - market_applications: {market_applications}
    - phase: {phase}
  expected_output: |
    Comprehensive architecture diagram package including:
    - System architecture overview diagrams (PNG/SVG)
    - Component interaction and flow diagrams
    - Data processing and memory architecture diagrams
    - Agent coordination and communication diagrams
    - Technical feature visualization diagrams
    - Prior art differentiation diagrams
    - Performance optimization diagrams
    - Professional diagram documentation and legends
  output_pydantic: lib.pydantic_output_models.DiagramOutput
  output_file: "output/{phase}/{id}_architecture_diagrams.md"
  agent: diagram_specialist
  context: [prior_art_research, claims_refinement, patent_document]
  priority: medium
  timeout: 300
  retry_attempts: 2

legal_review:
  description: |
    Comprehensive legal review and portfolio strategy analysis:
    
    PATENT: {title} (ID: {id})
    PHASE: {phase} ({phase_name})
    
    LEGAL REVIEW REQUIREMENTS:
    1. Patent law compliance assessment
    2. Claim strength analysis (breadth, validity, enforceability)
    3. Prior art risk evaluation and mitigation strategy
    4. Commercial value assessment with licensing potential
    5. Filing timeline and priority recommendations
    6. International strategy (EP, CN, JP considerations)
    7. Portfolio integration analysis
    8. Risk assessment and mitigation recommendations
    9. Prosecution budget and timeline estimates
    10. Final filing recommendation (PROCEED/MODIFY/DELAY)
    
    ANALYSIS FOCUS:
    - Legal compliance and USPTO requirements
    - Claim validity and enforceability
    - Prior art risk assessment
    - Commercial value optimization
    - Portfolio strategy integration
    - International filing considerations
    - Market timing considerations
    - Competitive landscape analysis
    
    Provide specific recommendations for filing decisions and strategy.
  expected_output: |
    Legal review report including:
    - Patent law compliance assessment
    - Claim strength analysis (breadth, validity, enforceability)
    - Prior art risk evaluation and mitigation strategy
    - Commercial value assessment with licensing potential
    - Filing timeline and priority recommendations
    - International strategy (EP, CN, JP considerations)
    - Portfolio integration analysis
    - Risk assessment and mitigation recommendations
    - Prosecution budget and timeline estimates
    - Final filing recommendation (PROCEED/MODIFY/DELAY)
  output_pydantic: lib.pydantic_output_models.LegalReviewOutput
  output_file: "output/{phase}/{id}_legal_review.md"
  agent: legal_reviewer
  context: [prior_art_research, claims_refinement, patent_document]
  priority: high
  timeout: 450
  retry_attempts: 2

associate_editor_review:
  description: |
    Provide initial editorial feedback and suggestions for the patent document:
    
    PATENT: {title} (ID: {id})
    
    ASSOCIATE EDITOR OBJECTIVES:
    1. Conduct initial review of patent document for quality and completeness
    2. Identify potential improvements and enhancement opportunities
    3. Provide constructive feedback and suggestions for consideration
    4. Assess technical accuracy and structural integrity
    5. Evaluate claim clarity and commercial value potential
    6. Suggest improvements for prior art differentiation
    7. Offer insights on document structure and formatting
    
    REVIEW FOCUS:
    - Technical accuracy and completeness
    - Claim structure and language clarity
    - Document organization and flow
    - Prior art integration effectiveness
    - Commercial value proposition strength
    - Technical specification quality
    - Cross-referencing with industry standards
    
    FEEDBACK APPROACH:
    - Provide thoughtful, constructive suggestions
    - Focus on specific, actionable improvements
    - Consider both technical and commercial aspects
    - Offer alternative approaches where beneficial
    - Maintain professional, supportive tone
    - Highlight both strengths and areas for improvement
    
    Your feedback will be considered by the senior editor, who will evaluate each suggestion 
    against their professional judgment and strategic objectives. Provide valuable insights 
    that support the editorial process while respecting the senior editor's final authority.
  expected_output: |
    Associate editor feedback report including:
    - Initial quality assessment and observations
    - Specific improvement suggestions and recommendations
    - Technical accuracy verification and enhancement ideas
    - Claim structure and language improvement suggestions
    - Document organization and flow recommendations
    - Prior art integration enhancement ideas
    - Commercial value optimization suggestions
    - Professional, constructive feedback for senior editor consideration
  output_pydantic: lib.pydantic_output_models.EditorialFeedbackOutput
  output_file: "output/{phase}/{id}_associate_editor_review.md"
  agent: associate_editor
  context: [prior_art_research, claims_refinement, patent_document]
  priority: medium
  timeout: 300
  retry_attempts: 2

editorial_review:
  description: |
    Conduct final editorial review of patent document and provide specific alterations for integration: 
    
    PATENT: {title} (ID: {id})
    
    EDITORIAL OBJECTIVES: 
    1. Review patent document for clarity, completeness, and quality 
    2. Identify specific alterations and improvements needed 
    3. Provide clear, actionable feedback for author integration 
    4. Assess technical accuracy and legal compliance 
    5. Suggest enhancements for commercial value and enforceability 
    6. Ensure proper integration of refined claims 
    7. VERIFY that the document contains ACTUAL content, not just descriptions or summaries
    8. Consider associate editor feedback and evaluate each suggestion
    
    REVIEW SCOPE:
    - Patent document structure and formatting 
    - Technical description clarity and completeness 
    - Claims integration and quality 
    - Prior art differentiation effectiveness 
    - Commercial value proposition clarity 
    - Legal compliance and USPTO requirements 
    - CONTENT VERIFICATION: Ensure actual technical details, not just descriptions
    - ASSOCIATE EDITOR FEEDBACK: Review and evaluate suggestions from associate editor
    
    EDITORIAL FOCUS: 
    - Specific text alterations and improvements 
    - Clear implementation guidance for changes 
    - Quality enhancement recommendations 
    - Technical accuracy verification 
    - Commercial value optimization suggestions 
    - CRITICAL: Remove any fake filing information (Application Numbers, Filing Dates, Patent IDs)
    - CRITICAL: Verify document contains actual patent content, not summaries or descriptions
    - COLLABORATIVE REVIEW: Consider associate editor insights while maintaining final editorial authority
    
    CRITICAL EDITORIAL REQUIREMENTS:
    - REMOVE any fake "Application Number", "Filing Date", or "Patent ID" fields
    - Replace any "Provisional Patent Application" headers with "Patent Analysis Document"
    - VERIFY the document contains complete technical specifications, not just summaries
    - CHECK that claims are fully written out, not just described
    - ENSURE background and detailed description sections contain actual content
    - CONFIRM the document is a complete patent application, not an outline or summary
    - EVALUATE associate editor feedback and adopt suggestions that align with your analysis
    
    CONTENT VERIFICATION CHECKLIST:
    - Does the document contain actual technical specifications and implementation details?
    - Are claims written out in full legal format, not just described?
    - Does the background section contain substantive technical content?
    - Is the detailed description comprehensive with actual examples and code?
    - Does the document appear to be a complete patent application rather than a summary?
    
    INTEGRATION VALIDATION CHECKLIST:
    - Document length: Is it 15-20 pages of actual content?
    - Technical depth: Are all technical_features fully explained?
    - Code examples: Are codebase_references included with snippets?
    - Claims completeness: Are all 20-25 claims present?
    - Alternative embodiments: Are all variations described?
    - Disclaimers: Is there a comprehensive disclaimers section?
    - Prior art: Is differentiation thoroughly discussed?
    
    If document is incomplete, REJECT it and demand regeneration.
    
    ASSOCIATE EDITOR FEEDBACK EVALUATION:
    - Review the associate editor's suggestions and recommendations
    - Evaluate each suggestion against your professional judgment and strategic objectives
    - Adopt suggestions that align with your analysis and enhance document quality
    - Reject suggestions that don't align with your editorial vision or strategic goals
    - Provide clear reasoning for your decisions in your final editorial review
    - Maintain final editorial authority while being open to valuable insights
    
    If the document appears to be only a summary or description rather than actual content, 
    provide specific instructions to the patent writer to regenerate the complete document.
    
    Provide specific, actionable alterations that the patent writer can directly integrate.
  expected_output: |
    Editorial review report including: 
    - Specific alterations and improvements for patent document 
    - Clear implementation guidance for each change 
    - Quality assessment and enhancement recommendations 
    - Technical accuracy verification and corrections 
    - Commercial value optimization suggestions 
    - Legal compliance improvements 
    - Integration instructions for patent writer
    - Evaluation of associate editor feedback and reasoning for adopted/rejected suggestions
  output_pydantic: lib.pydantic_output_models.FinalReviewOutput
  output_file: "output/{phase}/{id}_editorial_review.md"
  agent: editor
  context: [prior_art_research, claims_refinement, patent_document, associate_editor_review]
  priority: high
  timeout: 450
  retry_attempts: 2

patent_integration:
  description: |
    Create the final integrated provisional patent application document:
    
    PATENT: {title} (ID: {id})
    
    CRITICAL INTEGRATION REQUIREMENTS:
    1. COMBINE all content from prior documents into ONE comprehensive patent
    2. PRESERVE ALL technical details - DO NOT summarize or condense
    3. MAINTAIN the full 15-20 pages of content
    4. INCLUDE ALL code examples and implementation details
    5. INCORPORATE ALL 20-25 claims from the refined claims document
    6. ADD comprehensive disclaimers from the YAML
    7. INTEGRATE editorial improvements while maintaining technical depth
    
    INTEGRATION OBJECTIVES:
    - Create a COMPLETE provisional patent application
    - Integrate ALL content from component documents
    - Maintain technical depth and accuracy
    - Ensure USPTO compliance and professional formatting
    - Document integration decisions
    
    CONTENT TO INTEGRATE:
    1. FROM patent_document: Full technical description and structure
    2. FROM refined_claims: All 20-25 optimized claims
    3. FROM prior_art_research: Differentiation strategies
    4. FROM architecture_diagrams: Diagram descriptions
    5. FROM legal_review: Compliance considerations
    6. FROM editorial_review: Quality improvements
    7. FROM provisional_patents.yaml:
       - All disclaimers
       - All alternative embodiments
       - All technical features (expanded)
       - All codebase references (with code)
       - All key innovations
    
    MINIMUM CONTENT REQUIREMENTS BY SECTION:
    1. TITLE PAGE: Complete USPTO format
    2. CROSS-REFERENCES: All 5 related provisionals listed
    3. FIELD OF INVENTION: 1-2 paragraphs
    4. BACKGROUND: 2-3 pages of technical context
    5. SUMMARY: 1-2 pages of key innovations
    6. BRIEF DESCRIPTION OF DRAWINGS: Full descriptions
    7. DETAILED DESCRIPTION: 10-12 pages including:
       - System Architecture (2-3 pages with diagrams)
       - Technical Features (1-2 pages each, fully expanded)
       - Code Examples (from all codebase_references)
       - Implementation Details (comprehensive)
       - Alternative Embodiments (2-3 pages, all described)
    8. CLAIMS: All 20-25 claims in legal format
    9. DISCLAIMERS: Comprehensive section
    10. ABSTRACT: 150-word summary
    11. APPENDIX: Code references and technical specs
    
    EXPANSION REQUIREMENTS:
    - Each technical_feature: Expand to 2-3 paragraphs
    - Each codebase_reference: Include actual code snippet
    - Each alternative_embodiment: Full paragraph description
    - Each key_innovation: Detailed explanation
    - Each disclaimer: Properly formatted section
    
    INTEGRATION PROCESS:
    1. Start with patent_document as base
    2. Replace claims with refined_claims version
    3. Add all missing content from YAML
    4. Integrate editorial improvements
    5. Expand all compressed content
    6. Add code examples throughout
    7. Ensure 15-20 pages total
    
    QUALITY REQUIREMENTS:
    - NO summaries or placeholders
    - NO "as described above" references
    - NO compressed or condensed sections
    - ACTUAL technical content throughout
    - COMPLETE implementation details
    - FULL legal compliance
    
    TOOL PARAMETERS:
    Use patent_integration_tool with these exact parameters:
    - patent_id: {id}
    - title: {title}
    - description: {description}
    - key_claims: [list of claims from refined claims]
    - technical_features: {technical_features}
    - market_applications: {market_applications}
    - differentiation: {differentiation}
    - key_innovations: {key_innovations}
    - evidence: {evidence}
    - codebase_references: {codebase_references}
    - filing_requirements: {filing_requirements}
    - alternative_embodiments: {alternative_embodiments}
    - dependencies: {dependencies}
    - implementation_complexity: {implementation_complexity}
    - prior_art_risk: {prior_art_risk}
    - disclaimers: {disclaimers}
    - business_context: {business_context}
    - enterprise_features: {enterprise_features}
  expected_output: |
    Complete 15-20 page provisional patent application including:
    - Full USPTO-compliant formatting and structure
    - Title page with all required fields
    - Cross-references to all 5 related applications
    - Background section (2-3 pages of technical context)
    - Summary section (1-2 pages of innovations)
    - Detailed description (10-12 pages) with:
      * Complete system architecture
      * All technical features fully explained
      * Code examples from every codebase_reference
      * All alternative embodiments described
      * Implementation details and examples
    - All 20-25 refined claims in proper legal format
    - Comprehensive disclaimers section
    - Prior art differentiation discussion
    - Commercial value proposition
    - Complete technical specifications
    - 150-word abstract
    - Integration log documenting decisions
    - NO summaries, placeholders, or compressed content
    - ACTUAL technical content only
  output_pydantic: lib.pydantic_output_models.PatentDocumentOutput
  output_file: "output/{phase}/{id}_patent_application_final.md"
  agent: patent_writer
  context: [prior_art_research, claims_refinement, patent_document, editorial_review]
  priority: critical
  timeout: 900
  retry_attempts: 2

