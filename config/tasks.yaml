  context: [prior_art_research, claims_refinement, patent_document, legal_review, patent_integration]
  priority: medium
  timeout: 180
  retry_attempts: 1

patent_valuation:
  description: |
    Conduct comprehensive patent valuation analysis:
    
    PATENT: {title} (ID: {id})
    PHASE: {phase} ({phase_name})
    
    VALUATION REQUIREMENTS:
    1. Dynamic patent value calculation based on multiple factors
    2. Technical innovation assessment and scoring
    3. Market size and application domain analysis
    4. Competitive landscape and differentiation evaluation
    5. Risk assessment (prior art, implementation, regulatory)
    6. Commercial value and licensing potential analysis
    7. Comparative analysis with industry benchmarks
    8. Value optimization recommendations
    
    PATENT DATA:
    - Description: {description}
    - Technical Features: {technical_features}
    - Market Applications: {market_applications}
    - Key Claims: {key_claims}
    - Differentiation: {differentiation}
    
    VALUATION FOCUS:
    - Technical novelty and innovation factors
    - Market size and growth potential
    - Competitive positioning and barriers to entry
    - Risk-adjusted value calculation
    - Regulatory compliance advantages
    - Licensing and commercialization potential
    - Industry benchmark comparisons
    
    Provide comprehensive valuation with confidence intervals and recommendations.
    
    TOOL PARAMETERS:
    Use patent_valuation_tool with these exact parameters:
    - patent_id: {id}
    - title: {title}
    - description: {description}
    - key_claims: [list of claims]
    - technical_features: {technical_features}
    - market_applications: {market_applications}
