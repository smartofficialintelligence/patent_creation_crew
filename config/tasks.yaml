    - Value optimization recommendations
    - Filing strategy and priority recommendations
  output_pydantic: tools.patent_valuation.PatentValuationInput
  output_file: "patent_output/{tier}/{id}_valuation_report.md"
  agent: valuation_expert
  context: [prior_art_research, claims_refinement]

