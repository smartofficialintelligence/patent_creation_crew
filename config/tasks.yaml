# Task generation configuration
task_generation:
  variable_mapping:
    title: "patent_idea['title']"
    id: "patent_idea['id']"
    description: "patent_idea['description']"
    claims_list: "chr(10).join(f'- {claim}' for claim in patent_idea['key_claims'])"
    value_estimate: "patent_idea.get('value_estimate', '$2-15M')"
    market_applications: "', '.join(patent_idea.get('market_applications', ['AI optimization']))"
    technical_features: "', '.join(patent_idea.get('technical_features', []))"
    differentiation: "patent_idea.get('differentiation', 'TBD')"
    tier_name: "PATENT_CONFIG['portfolio_tiers'][tier]['name']"
    description_length: "len(patent_idea['description'].split())"
    claims_count: "len(patent_idea['key_claims'])" 