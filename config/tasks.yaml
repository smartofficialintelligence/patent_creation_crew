  output_pydantic: tools.provisional_cover_sheet.ProvisionalCoverSheetInput
  output_file: "patent_output/{tier}/{id}_cover_sheet.md"
  agent: cover_sheet_specialist
  context: [prior_art_research, claims_refinement, patent_document, legal_review, patent_integration, colab_demo_generation, colab_demo_editorial_review, colab_demo_integration]

